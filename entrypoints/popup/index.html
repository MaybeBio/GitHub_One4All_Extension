<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub One4All</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🚀</span>
        <div>
          <h1>GitHub One4All</h1>
          <p class="muted">33 repo tools, one menu</p>
        </div>
      </div>
      <button id="reset" class="text-btn" type="button">Reset</button>
    </header>

    <div id="repo-chip" class="repo-chip">Open a GitHub repo to use One4All</div>

    <main>
      <section class="section">
        <h2>Enabled tools</h2>
        <p class="muted small">Unverified tools are off by default. Enable them at your own risk.</p>
        <div id="provider-list" class="provider-list"></div>
      </section>

      <section class="section">
        <h2>Custom tools</h2>
        <div id="custom-list" class="custom-list"></div>
        <form id="custom-form" class="custom-form" novalidate>
          <input id="custom-name" type="text" placeholder="Name" autocomplete="off" />
          <input
            id="custom-url"
            type="text"
            placeholder="https://example.com/{owner}/{repo}"
            autocomplete="off"
            spellcheck="false"
          />
          <p id="custom-error" class="error" hidden></p>
          <button type="submit" class="primary">Add custom tool</button>
        </form>
        <p class="muted small">Use {owner} and {repo} placeholders in the URL.</p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
